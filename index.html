<!-- PAINEL DE LANÇAMENTO -->
<div class="card">
    <h2>Novo Lançamento</h2>
    <div class="form-grid">
        <div>
            <label>Data</label>
            <input type="date" id="data">
        </div>
        <div>
            <label>Conta / Origem / Destino</label>
            <select id="conta">
                <option value="Cartão PJ Nubank">Cartão PJ Nubank</option>
                <option value="Conta Corrente PJ Nubank">Conta Corrente PJ Nubank</option>
                <option value="Conta Corrente PF Banco ITI">Conta Corrente PF Banco ITI</option>
                <option value="Cartão PF Banco Iti">Cartão PF Banco Iti</option>
                <option value="Conta Itaú PF">Conta Itaú PF</option>
                <option value="Dinheiro">Dinheiro</option>
            </select>
        </div>
        <div>
            <label>Valor (R$) [Use negativo para saída]</label>
            <input type="text" id="valor" inputmode="text" autocomplete="off" placeholder="Ex: 150,00 ou -50,00">
        </div>
        <div>
            <label>Descrição</label>
            <input type="text" id="descricao" placeholder="Ex: Fornecedor, Venda...">
        </div>
    </div>
    <button onclick="adicionarMovimento()">Adicionar Lançamento</button>
</div>

<!-- RESUMO / KPIS -->
<div class="dashboard-grid" id="kpis">
    <!-- Preenchido via JS -->
</div>
